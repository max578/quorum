repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/posit-dev/air
    rev: 0.5.0
    hooks:
      - id: air

  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3
    hooks:
      - id: style-files
      - id: lintr
      - id: parsable-R
      - id: no-browser-statement
      - id: no-debug-statement
      - id: readme-rmd-rendered
      - id: spell-check
      - id: deps-in-desc

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: r-style-sensitive-info-guard
        name: Block maintainer-private patterns from package sources
        description: >-
          Package sources must not embed maintainer-private identifiers
          (institutional staff IDs, home-directory paths, or working-notes
          filenames). ORCIDs and project-appropriate
          emails are permitted in DESCRIPTION Authors@R and @author roxygen
          tags only -- those locations are intentionally excluded by the
          --include filter below.
        entry: >-
          bash -c '
          set -e;
          patterns="(^|[^[:alnum:]_])a[0-9]{7}([^[:alnum:]_]|$)|/Users/[^/]+/|/home/[^/]+/|aa_notes|PROJECT_LOG|research_notes|implementation_plan_";
          if grep -RInE
          --include="*.R"
          --include="*.Rmd"
          --include="*.qmd"
          --include="NEWS.md"
          --include="README*.md"
          --exclude-dir=revdep
          --exclude-dir=.git
          "$patterns" .;
          then
          echo "r-style-sensitive-info-guard: a staff ID, home-directory path or working-notes filename was found in a package source file" >&2;
          exit 1;
          fi'
        language: system
        pass_filenames: false
