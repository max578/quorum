version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      r-lib-actions:
        patterns:
          - "r-lib/actions*"
          - "quarto-dev/quarto-actions*"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "devcontainer"]
